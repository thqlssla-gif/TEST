function collection(which){const ids=which==="wrong"?Object.keys(db.mistakes).filter(id=>db.mistakes[id].count>0):db.bookmarks;const usable=ids.filter(id=>byId[id]&&(db.mode==="written"?!isPr(id):isPr(id)));const title=which==="wrong"?"오답노트":"북마크";return header(which==="wrong"?"RETRY & REVIEW":"MY SAVED QUESTIONS",title,"다시 확인할 문제를 모아 두고 반복해서 풀어보세요.")+'<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">'+badge(usable.length+"문항","gray")+btn("모아풀기 →","start-collection","primary sm",'data-kind="'+which+'" '+(!usable.length?"disabled":""))+'</div>'+(!usable.length?'<div class="empty"><div class="emo">'+(which==="wrong"?"↺":"☆")+'</div><b>아직 문제가 없습니다.</b><span>학습을 시작하면 이곳에 문제를 모을 수 있습니다.</span></div>':usable.map(id=>{const x=byId[id];return '<div class="listitem"><div class="desc"><small>'+h(x.topic)+' · '+h(id)+(which==="wrong"?" · 오답 "+db.mistakes[id].count+"회":"")+'</small><b>'+h(x.q)+'</b></div>'+btn("풀기","start-one","sm",'data-id="'+id+'"')+(which==="bookmarks"?'<button class="star on" data-action="star" data-id="'+id+'">★</button>':"")+'</div>'}).join(""))+'</div>'}
function history(){const records=db.history.slice().reverse().filter(r=>historyMode==="all"||r.mode===historyMode),cnt=records.length;return header("MY PERFORMANCE","학습 기록","나의 점수와 풀었던 문제를 다시 확인할 수 있습니다.")+'<div class="stats grid">'+stats("총 학습 횟수",db.history.length,"회")+stats("최고 점수",db.history.length?Math.max(...db.history.map(x=>x.score)):0,"점")+stats("전체 풀이 문항",db.history.reduce((a,x)=>a+x.total,0),"문항")+stats("오답노트",countMist(),"문항")+'</div><div class="panel"><div class="filterline"><div class="seg">'+[["all","전체"],["written","필기"],["practical","실기"]].map(x=>'<button data-action="history-mode" data-value="'+x[0]+'" class="'+(historyMode===x[0]?"active":"")+'">'+x[1]+'</button>').join("")+'</div></div>'+(cnt?'<div style="overflow:auto"><table class="historytable"><thead><tr><th>학습 일시</th><th>유형</th><th>내용</th><th>정답</th><th>점수</th><th>결과</th><th></th></tr></thead><tbody>'+records.map(r=>'<tr><td>'+new Date(r.ts).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+'</td><td>'+badge(r.mode==="written"?"필기":"실기","")+'</td><td>'+h(r.kind)+" · "+(r.mode==="written"?r.year+"년 기준":"주관식")+'</td><td>'+r.okCount+"/"+r.total+'</td><td><b>'+r.score+'점</b></td><td>'+badge(r.pass===null?"연습":r.pass?"합격 기준 충족":"기준 미달",r.pass===null?"gray":r.pass?"good":"bad")+'</td><td>'+btn("상세","show-result","sm",'data-id="'+r.id+'"')+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">아직 학습 기록이 없습니다.</div>')+'<div class="filterline" style="margin-top:20px">'+btn("학습 기록 JSON 백업","export","")+btn("전체 기록 초기화","reset","danger")+'</div></div>'}
function guide(){return header("EXAM GUIDE","정보처리기사 시험 안내","연도에 따라 필기 출제기준이 달라지므로 본인의 응시 연도를 확인하세요.")+'<div class="grid tiles"><section class="panel"><h3>필기 · 2026년</h3><ul class="note-lines"><li>5과목 · 과목당 20문항 · 총 100문항</li><li>객관식 4지 택일 · 150분</li><li>과목별 40점 이상·전체 평균 60점 이상</li></ul>'+btn("2026 필기 연습","select-guide","",'data-mode="written" data-year="2026"')+'</section><section class="panel"><h3>필기 · 2027~2029년</h3><ul class="note-lines"><li>4과목 · 과목당 20문항 · 총 80문항</li><li>객관식 4지 택일 · 120분</li><li>과목별 40점 이상·전체 평균 60점 이상</li></ul>'+btn("2027 필기 연습","select-guide","primary",'data-mode="written" data-year="2027"')+'</section><section class="panel"><h3>실기 · 정보처리 실무</h3><ul class="note-lines"><li>필답형 · 150분</li><li>합격 기준 60점 이상</li><li>프로그래밍·SQL·보안·네트워크 등 연습</li><li>사이트 실기 점수는 문항별 5점인 자체 연습용 점수입니다.</li></ul>'+btn("실기 연습","select-guide","",'data-mode="practical"')+'</section><section class="panel"><h3>학습 데이터와 출처</h3><p class="mode-tip">이 사이트의 문항은 학습용 자체 제작 문제입니다. 실제 기출문항이나 시험 합격을 보장하지 않으며 최신 공고 및 세부 출제범위는 Q-Net 원문을 확인하세요.</p><div class="callout">🔒 같은 링크를 여러 학생이 사용해도 서로 다른 기기·브라우저의 기록은 보이지 않습니다. 같은 PC의 같은 브라우저를 함께 쓰면 기록이 공유될 수 있습니다.</div><p style="margin-top:15px"><a target="_blank" rel="noopener noreferrer" href="https://www.q-net.or.kr/cst006.do?code=1202&gId=22&gSite=&id=cst00601">Q-Net 공식 출제기준 자료실 ↗</a></p></section></div>'}
function start(kind,subject,ids){if(db.session){if(!confirm("진행 중인 연습이 있습니다. 새로운 연습을 시작하면 이전 미제출 답안은 사라집니다. 계속할까요?"))return}
const mode=ids?isPr(ids[0])?"practical":"written":db.mode,year=db.year;let pool=mode==="written"?ALL:PR,selected=[];
if(ids){selected=ids.map(id=>byId[id]).filter(Boolean);if(mode==="written"&&year===2027)selected=selected.filter(x=>x.old>=0)}
else if(kind==="full"&&mode==="written"){const n=year===2027?4:5;for(let i=0;i<n;i++)selected.push(...pick(ALL.filter(x=>(year===2027?(x.old<2?0:x.old-1):x.old)===i),20));selected=shuffle(selected)}
else if(kind==="topic"){const n=mode==="written"?names()[Number(subject)]:[...new Set(PR.map(x=>x.topic))][Number(subject)];selected=pick(pool.filter(x=>(mode==="written"?names()[year===2027?(x.old<2?0:x.old-1):x.old]:x.topic)===n),10)}
else if(kind==="wrong")selected=pick(pool.filter(x=>db.mistakes[x.id]&&db.mistakes[x.id].count>0),20);
else if(kind==="bookmarks")selected=pick(pool.filter(x=>db.bookmarks.includes(x.id)),20);
else selected=pick(pool,20);
if(!selected.length){toast("연습할 문제가 없습니다.");return}
const duration=kind==="full"?(mode==="written"?(year===2027?7200:9000):9000):selected.length===1?0:mode==="written"?selected.length*90:selected.length*210;
db.session={mode,year,kind:kind==="full"?"실전 모의고사":kind==="topic"?"과목별 연습":kind==="quick"?"빠른 연습":kind==="wrong"?"오답 다시풀기":kind==="bookmarks"?"북마크 다시풀기":"단일 문제",ids:selected.map(x=>x.id),idx:0,answers:{},started:Date.now(),duration};db.mode=mode;save();nav("quiz")}
function elapsed(){const s=db.session;return s?Math.max(0,Math.ceil((s.duration*1000-(Date.now()-s.started))/1000)):0}
function clock(){clearInterval(clockHandle);const s=db.session;if(!s)return;function update(){if(page!=="quiz"||!db.session){clearInterval(clockHandle);return}const t=el("timer");if(t){const x=elapsed();t.textContent=s.duration?(String(Math.floor(x/3600)).padStart(2,"0")+":"+String(Math.floor(x%3600/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")):"시간 제한 없음";if(s.duration&&x===0){clearInterval(clockHandle);submit(true)}}}update();clockHandle=setInterval(update,1000)}
function quiz(){const s=db.session;if(!s)return '<div class="empty">진행 중인 연습이 없습니다.</div>'+btn("대시보드로","nav","",'data-page="home"');const x=byId[s.ids[s.idx]],ans=s.answers[x.id],done=s.ids.filter(id=>String(s.answers[id]??"").trim()!=="").length,pr=s.mode==="practical";return header(s.mode==="written"?"WRITTEN EXAM":"PRACTICAL EXAM",s.kind,pr?"주관식 답을 입력하고 마지막에 한 번에 채점합니다.":"정답은 마지막 제출 후 확인할 수 있습니다.")+'<div class="quizgrid"><section class="quiz-card"><div class="quiz-meta"><span>'+h(pr?x.topic:(s.year===2027?names27[x.old<2?0:x.old-1]:names26[x.old]))+' / '+h(x.topic)+'</span><button class="star '+(db.bookmarks.includes(x.id)?"on":"")+'" data-action="star" data-id="'+x.id+'" aria-label="이 문제 북마크">★</button></div><div class="bar"><span style="width:'+Math.round(done/s.ids.length*100)+'%"></span></div><div class="qtop">QUESTION '+String(s.idx+1).padStart(2,"0")+' / '+s.ids.length+'</div><div class="qstem">'+fmt(x.q)+'</div>'+(pr?'<label class="fieldlabel" for="writtenanswer">답안 입력</label><textarea id="writtenanswer" class="answerbox" placeholder="답을 직접 입력하세요. 영문 약어는 대소문자 구분 없이 채점합니다." data-change="answer">'+h(ans??"")+'</textarea><p class="qhint">※ 자동 채점은 모범답안 표현과 비교하는 방식입니다. 제출 후 직접 채점 수정도 가능합니다.</p>':'<div class="options">'+x.choices.map((v,i)=>'<button class="opt '+(String(ans)===String(i)?"selected":"")+'" data-action="answer-option" data-value="'+i+'"><span class="bubble">'+(i+1)+'</span><span>'+fmt(v)+'</span></button>').join("")+'</div>')+'<div class="quizactions"><div style="display:flex;gap:8px">'+btn("← 이전","prev-q","",s.idx===0?"disabled":"")+btn("다음 →","next-q","",s.idx===s.ids.length-1?"disabled":"")+'</div>'+btn("최종 제출","submit","primary")+'</div></section><aside><div class="panel"><div class="name">남은 시간</div><div id="timer" class="timer">--:--:--</div><div style="margin:16px 0 5px;display:flex;justify-content:space-between"><b>풀이 현황</b><span class="progress-note">'+done+'/'+s.ids.length+' 응답</span></div><div class="question-map">'+s.ids.map((id,i)=>'<button class="number-btn '+(i===s.idx?"current":String(s.answers[id]??"").trim()!=""?"answered":"")+'" data-action="jump" data-index="'+i+'">'+(i+1)+'</button>').join("")+'</div><div class="callout"><b>답안 자동 저장</b><p style="margin:5px 0 0">선택·입력 즉시 현재 브라우저에 보관합니다.</p></div>'+btn("연습 중단","stop","danger wide", 'style="margin-top:14px"')+'</div></aside></div>'}
function submit(force){const s=db.session;if(!s)return;const unanswered=s.ids.filter(id=>String(s.answers[id]??"").trim()==="").length;if(!force&&unanswered&&!confirm("아직 "+unanswered+"문항에 답하지 않았습니다. 제출할까요?"))return;if(!force&&!confirm("답안을 제출하고 정답과 해설을 확인할까요?"))return;
const entries=s.ids.map(id=>{const x=byId[id];return {id,answer:s.answers[id]??"",ok:correct(x,s.answers[id]),override:null}});
const r={id:"R"+Date.now(),ts:Date.now(),mode:s.mode,year:s.year,kind:s.kind,entries,duration:s.duration,total:entries.length,score:0,okCount:0,pass:null,bySubject:[]};scoreResult(r);db.history.push(r);db.last=r.id;db.session=null;updateMistakes(r);save();nav("result")}
function scoreResult(r){r.okCount=r.entries.filter(e=>e.override===null?e.ok:e.override).length;r.score=Math.round(r.okCount/r.total*100);if(r.mode==="written"&&r.kind==="실전 모의고사"){const n=r.year===2027?4:5;r.bySubject=[];for(let i=0;i<n;i++){const arr=r.entries.filter(e=>{const x=byId[e.id];return (r.year===2027?(x.old<2?0:x.old-1):x.old)===i});const ok=arr.filter(e=>e.override===null?e.ok:e.override).length;r.bySubject.push({name:(r.year===2027?names27:names26)[i],correct:ok,total:arr.length,percent:arr.length?Math.round(ok/arr.length*100):0})}r.pass=r.score>=60&&r.bySubject.every(x=>x.percent>=40)}else if(r.mode==="practical"&&r.kind==="실전 모의고사")r.pass=r.score>=60;else r.pass=null}
function updateMistakes(r){for(const e of r.entries){const ok=e.override===null?e.ok:e.override;if(!ok){db.mistakes[e.id]=db.mistakes[e.id]||{count:0};db.mistakes[e.id].count++}}}
function result(){const r=db.history.find(x=>x.id===db.last);if(!r)return header("RESULT","성적표 없음","학습 기록에서 확인하세요.");const manual=r.mode==="practical";return header("RESULT ANALYSIS","학습 결과 분석","모범답안과 해설을 살펴보고 틀린 문항을 복습해 보세요.")+'<div class="grid two"><section class="panel" style="text-align:center"><div class="scorecircle" style="--pct:'+r.score+'%"><span>'+r.score+'<small style="font-size:12px;margin-left:2px">점</small></span></div><h3 style="font-size:19px">'+(r.pass===null?"연습 완료":r.pass?"합격 기준 충족!":"합격 기준에 미달했어요")+'</h3><p class="sub">'+r.okCount+' / '+r.total+'문항 정답 · '+h(r.kind)+'</p><div class="filterline" style="justify-content:center">'+btn("오답노트","nav","",'data-page="wrong"')+btn("다시 연습하기","nav","primary",'data-page="setup"')+'</div></section><section class="panel"><h3>성적 요약</h3>'+badge(r.mode==="written"?"필기 "+r.year:"실기 주관식","")+'<div class="subject-line"><div><span>정답률</span><strong>'+r.score+'%</strong></div><div class="bar"><span style="width:'+r.score+'%"></span></div></div>'+(r.bySubject&&r.bySubject.length?r.bySubject.map(x=>'<div class="subject-line"><div><span>'+h(x.name)+' ('+x.correct+'/'+x.total+')</span><strong>'+x.percent+'%</strong></div><div class="bar"><span style="width:'+x.percent+'%"></span></div></div>').join(""):'<p class="mode-tip">실기 점수는 문항별 5점의 자체 연습용 결과입니다. 공식 부분점수·정답 인정 방식과 다를 수 있습니다.</p>')+'</section></div><div class="section-head"><h2>문항별 해설</h2><small>'+r.total+'문항 전체</small></div>'+(manual?'<div class="callout" style="margin-bottom:15px"><b>실기 가채점 안내</b><p style="margin:7px 0 0">자동 채점은 등록된 정답 표현만 인식합니다. 의미가 맞거나 동의어인 경우 아래에서 정답 처리 여부를 직접 변경할 수 있습니다. 변경하면 연습 점수도 바뀝니다.</p></div>':"")+r.entries.map((e,i)=>{const x=byId[e.id],ok=e.override===null?e.ok:e.override,ans=r.mode==="written"?(e.answer===""?"미응답":(Number(e.answer)+1)+". "+h(x.choices[e.answer])):(e.answer?h(e.answer):"미응답"),key=r.mode==="written"?(x.answer+1)+". "+h(x.choices[x.answer]):h(x.answers.join(" / "));return '<article class="review"><div class="review-head"><span class="chip gray">Q'+(i+1)+' · '+h(x.topic)+'</span>'+badge(ok?"정답":"오답",ok?"good":"bad")+'</div><p class="review-q">'+fmt(x.q)+'</p><div class="review-ans">내 답안: <b>'+ans+'</b></div><div class="review-ans" style="margin-top:5px">모범답안: <b style="color:#6254be">'+key+'</b></div><div class="expl">💡 '+h(x.why)+'</div>'+(manual?'<div class="review-toggle"><span class="mode-tip">내 답안 판정:</span><button data-action="override" data-id="'+r.id+'" data-entry="'+i+'" data-ok="true" class="'+(ok?"on":"")+'">정답 인정</button><button data-action="override" data-id="'+r.id+'" data-entry="'+i+'" data-ok="false" class="'+(!ok?"on bad":"")+'">오답 처리</button></div>':"")+'</article>'}).join("")}
function exportData(){const a=document.createElement("a"),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),history:db.history,mistakes:db.mistakes,bookmarks:db.bookmarks},null,2)],{type:"application/json;charset=utf-8"});a.href=URL.createObjectURL(blob);a.download="information-processing-study-record.json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("학습 기록을 저장했습니다.")}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action,s=db.session;switch(a){
case"menu":mobile=!mobile;render();break;case"close":mobile=false;render();break;case"nav":nav(b.dataset.page);break;
case"mode":toggleMode(b.dataset.value);break;case"year":toggleYear(Number(b.dataset.value));break;
case"setup-kind":setupKind=b.dataset.value;render();break;case"start-setup":start(setupKind,setupKind==="topic"?setupSubject:null);break;case"start-full":start("full");break;case"start-topic":start("topic",b.dataset.subject);break;case"start-one":start("single",null,[b.dataset.id]);break;case"start-collection":start(b.dataset.kind);break;
case"answer-option":if(!s)return;s.answers[s.ids[s.idx]]=Number(b.dataset.value);save();render();break;
case"next-q":if(s&&s.idx<s.ids.length-1){s.idx++;save();render()}break;case"prev-q":if(s&&s.idx>0){s.idx--;save();render()}break;case"jump":if(s){s.idx=Number(b.dataset.index);save();render()}break;
case"submit":submit(false);break;case"stop":if(confirm("진행 중인 연습을 중단하고 미제출 답안을 삭제할까요?")){db.session=null;save();nav("home")}break;
case"star":{const id=b.dataset.id;db.bookmarks=db.bookmarks.includes(id)?db.bookmarks.filter(x=>x!==id):db.bookmarks.concat(id);save();render();break}
case"history-mode":historyMode=b.dataset.value;render();break;case"show-result":db.last=b.dataset.id;save();nav("result");break;
case"override":{const r=db.history.find(x=>x.id===b.dataset.id);if(!r)return;const e=r.entries[Number(b.dataset.entry)],val=b.dataset.ok==="true";if(e.override===val)return;e.override=val;scoreResult(r);save();render();break}
case"apply-search":search=el("banksearch").value;filter=el("bankfilter").value;questionPage=0;render();break;
case"next-bank":questionPage++;render();break;case"prev-bank":questionPage=Math.max(0,questionPage-1);render();break;
case"export":exportData();break;case"reset":if(confirm("모의고사 기록·오답·북마크를 모두 초기화할까요? 복구할 수 없습니다.")){db.history=[];db.mistakes={};db.bookmarks=[];db.last=null;db.session=null;save();nav("home")}break;
case"select-guide":db.mode=b.dataset.mode;if(b.dataset.year)db.year=Number(b.dataset.year);save();nav("setup");break
}});
document.addEventListener("change",e=>{if(e.target.dataset.change==="subject"){setupSubject=e.target.value}if(e.target.dataset.change==="answer"&&db.session){db.session.answers[db.session.ids[db.session.idx]]=e.target.value;save()}});
document.addEventListener("input",e=>{if(e.target.id==="writtenanswer"&&db.session){db.session.answers[db.session.ids[db.session.idx]]=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="banksearch"){search=e.target.value;filter=el("bankfilter").value;questionPage=0;render()}if(page==="quiz"&&db.session&&db.session.mode==="written"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&["1","2","3","4"].includes(e.key)){db.session.answers[db.session.ids[db.session.idx]]=Number(e.key)-1;save();render()}});
window.addEventListener("beforeunload",save);
render();
})();</script></body></html>
