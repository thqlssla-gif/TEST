function updateClock(){const s=db.session;if(!s||s.mode!=='exam')return;let left=timeLeft(s);document.querySelectorAll('.timer-text').forEach(el=>{el.textContent=fmtTime(left);el.closest('.timebox')?.classList.toggle('warning',left<=300);});if(left===0){toast('시험 시간이 종료되어 자동으로 채점합니다.');finishSession(true);}}
function markMistake(id,isCorrect){if(isCorrect)return;const m=db.mistakes[id]||{count:0,cleared:false};m.count+=1;m.cleared=false;m.last=Date.now();db.mistakes[id]=m;}
function grade(){const s=db.session,q=BY_ID[s.ids[s.index]],id=q.id;if(s.answers[id]===undefined){toast('보기를 먼저 선택해 주세요.');return;}if(s.graded[id]!==undefined)return;let correct=s.answers[id]===q.answer;s.graded[id]=correct;markMistake(id,correct);save();render();}
function next(){const s=db.session;if(s.mode==='study'&&s.graded[s.ids[s.index]]===undefined){toast('먼저 정답·해설을 확인해 주세요.');return;}if(s.index===s.ids.length-1){if(s.mode==='study')finishSession();else submitSession();return;}s.index++;save();render();window.scrollTo({top:0,behavior:'instant'});}
function calcResult(s){const usedIds=s.mode==='study'?s.ids.filter(id=>s.graded[id]!==undefined):s.ids;let correct=0,byArea={};let wrongIds=[];for(const id of usedIds){const q=BY_ID[id],good=s.answers[id]===q.answer;if(!byArea[q.area])byArea[q.area]={total:0,correct:0};byArea[q.area].total++;if(good){correct++;byArea[q.area].correct++;}else wrongIds.push(id);}const score=usedIds.length?Math.round(correct/usedIds.length*1000)/10:0;let passed=null;if(s.kind==='full'){passed=score>=60&&(s.stage===1||Object.values(byArea).every(v=>v.correct/v.total>=.4));}return {id:Date.now(),stage:s.stage,kind:s.kind,mode:s.mode,ts:Date.now(),score,correct,total:usedIds.length,passed,byArea,wrongIds,ids:usedIds,answers:s.answers,duration:s.mode==='exam'?s.duration-timeLeft(s):Math.max(0,Math.round((Date.now()-s.startedAt)/1000))};}
function finishSession(auto=false){const s=db.session;if(!s)return;if(s.mode==='study'&&Object.keys(s.graded).length===0){toast('먼저 한 문제 이상 정답을 확인해 주세요.');return;}const r=calcResult(s);if(s.mode==='exam'){for(const id of r.wrongIds)markMistake(id,false);}else{for(const id of r.wrongIds){if(s.graded[id]===undefined)markMistake(id,false);}}db.lastResult=r;db.history.unshift({id:r.id,stage:r.stage,kind:r.kind,mode:r.mode,ts:r.ts,score:r.score,correct:r.correct,total:r.total,passed:r.passed,byArea:r.byArea,duration:r.duration});db.history=db.history.slice(0,50);db.session=null;page='result';resultFilter='wrong';save();render();window.scrollTo(0,0);}
function submitSession(){const s=db.session;if(!s)return;const unanswered=s.ids.filter(id=>s.answers[id]===undefined).length;const phrase=unanswered?`아직 ${unanswered}문항을 선택하지 않았습니다. 제출할까요?`:'답안을 최종 제출하고 채점할까요?';if(window.confirm(phrase))finishSession();}
function resultView(){const r=db.lastResult;if(!r)return `<div class="empty-state">최근 채점 결과가 없습니다.<div style="margin-top:14px"><button class="primary-btn" data-action="navigate" data-page="setup">모의고사 시작하기</button></div></div>`;const wrong=r.wrongIds||[];const items=(resultFilter==='wrong'?wrong:r.ids);return `${headline('RESULT ANALYSIS',`${r.mode==='study'?'학습 결과':'시험 결과'} · ${r.stage}차`,'정답률과 약한 과목을 확인하고, 틀린 문항을 바로 다시 풀어보세요.')}<div style="height:18px"></div><section class="result-hero"><div><span class="chip ${r.passed===true?'green':r.passed===false?'red':''}">${r.passed===null?'학습 완료':r.passed?'✓ 합격 기준 충족':'합격 기준 미달'}</span><div class="score-big">${r.score}<small> / 100점</small></div><p style="color:#c6d1e8;line-height:1.6;margin:0;font-size:12px">${r.correct}문항 정답 · ${r.total-r.correct}문항 오답 · ${Math.floor(r.duration/60)}분 ${r.duration%60}초 사용</p></div><div class="result-circle" style="--percent:${r.score}%"><div><strong>${Math.round(r.score)}%</strong><small>정답률</small></div></div></section><div class="stat-grid" style="margin-top:16px"><div class="stat"><div><div class="stat-label">맞힌 문제</div><div class="stat-value">${r.correct}<small>문항</small></div></div>${iconBlock('check','green')}</div><div class="stat"><div><div class="stat-label">틀린 문제</div><div class="stat-value">${wrong.length}<small>문항</small></div></div>${iconBlock('wrong','orange')}</div><div class="stat"><div><div class="stat-label">학습 시간</div><div class="stat-value">${Math.floor(r.duration/60)}<small>분</small></div></div>${iconBlock('clock')}</div></div><div class="section-title">과목별 성취도 <small>${r.kind==='full'&&r.stage===2?'과목별 40% 미만 과락':'문항별 정답률 기준'}</small></div><div class="panel"><div class="subject-progress">${Object.entries(r.byArea).map(([area,x])=>{const pct=Math.round(x.correct/x.total*100);return `<div><div class="subject-row-header"><span>${h(area)} <small class="muted">${x.correct}/${x.total}</small></span><span style="color:${pct<40?'#ce5566':'#7161e6'}">${pct}% ${r.kind==='full'&&r.stage===2&&pct<40?'· 과락':''}</span></div><div class="progress-track"><div class="progress-fill ${pct>=60?'green':''}" style="width:${pct}%"></div></div></div>`}).join('')}</div></div><div class="btn-row" style="margin-top:17px"><button class="primary-btn" data-action="retrywrong" ${wrong.length===0?'disabled':''}>${svg('refresh',16)} 틀린 ${wrong.length}문항 다시 풀기</button><button class="secondary-btn" data-action="startfull">${svg('exam',16)} 새 모의고사</button><button class="ghost-btn" data-action="navigate" data-page="home">대시보드</button></div><div class="section-title">문항별 정답 및 해설 <small>${resultFilter==='wrong'?'오답만 보기':'전체 문제 보기'}</small></div><div class="btn-row" style="margin-bottom:14px"><button class="${resultFilter==='wrong'?'secondary-btn':'ghost-btn'}" data-action="resultfilter" data-filter="wrong">틀린 문제 (${wrong.length})</button><button class="${resultFilter==='all'?'secondary-btn':'ghost-btn'}" data-action="resultfilter" data-filter="all">전체 보기 (${r.total})</button></div>${items.length?items.map(id=>{let q=BY_ID[id],index=r.ids.indexOf(id),a=r.answers[id],good=a===q.answer;return `<article class="review-card"><div class="review-head"><div><span class="chip ${good?'green':'red'}">${good?'정답':'오답 / 미응답'}</span> <span class="chip gray">${h(q.topic)}</span></div><button class="question-save ${db.bookmarks.includes(id)?'on':''}" data-action="bookmark" data-id="${id}" aria-label="북마크">${db.bookmarks.includes(id)?'★':'☆'}</button></div><h3>${index+1}. ${fmt(q.stem)}</h3><p class="review-answer">내 답변: ${a===undefined?'미응답':`${a+1}번 · ${fmt(q.options[a])}`}</p><p class="review-explain"><strong>정답 ${q.answer+1}번 · ${fmt(q.options[q.answer])}</strong><br>${fmt(q.reason)}</p></article>`}).join(''):`<div class="empty-state">틀린 문항이 없습니다. 잘했어요!</div>`}`;}
function topicsView(){let qq=inStage();const topics=[...new Set(qq.map(q=>q.topic))];return `${headline('FOCUSED PRACTICE','단원별 집중 연습','약한 부분만 골라서 공부하고, 문제를 푼 직후 핵심 해설을 확인할 수 있습니다.')}<div class="topic-list">${topics.map((t,i)=>{const list=qq.filter(q=>q.topic===t);const icons=['⌘','▣','▥','⚙','⌥','◎','◈'];return `<div class="topic-card"><div class="spaced"><div class="ac-icon" style="margin-bottom:0;width:38px;height:38px">${icons[i%icons.length]}</div><span class="chip gray">${list.length}문항</span></div><h3 style="margin:16px 0 7px">${h(t)}</h3><p>기본 개념부터 시험형 문제까지 골고루 연습합니다.</p><div class="card-foot"><span>${h(list[0].area)}</span><button class="arrow-btn" title="이 단원 연습" aria-label="${h(t)} 연습 시작" data-action="starttopic" data-topic="${h(t)}">→</button></div></div>`}).join('')}</div><div class="note">단원별 연습은 최대 10문제를 무작위로 골라 출제합니다. 10문제 미만의 단원은 수록된 문제를 모두 사용합니다.</div>`;}
function makeSmallCard(q,type='bank'){let wrong=db.mistakes[q.id];return `<article class="small-q"><div class="spaced"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">${q.stage}차</span><span class="chip gray">${h(q.topic)}</span></div><button class="question-save ${db.bookmarks.includes(q.id)?'on':''}" data-action="bookmark" data-id="${q.id}" aria-label="북마크">${db.bookmarks.includes(q.id)?'★':'☆'}</button></div><p>${fmt(q.stem)}</p><span class="note">${h(q.area)}${wrong?' · 오답 '+wrong.count+'회':''}</span><div class="small-q-foot"><button class="text-link" data-action="single" data-id="${q.id}">이 문제 풀어보기 ${svg('arrow',13)}</button>${type==='wrong'?`<button class="text-link" data-action="mastered" data-id="${q.id}">이해 완료 ✓</button>`:''}</div></article>`;}
function bankQuestions(){let list=inStage();if(bankArea!=='all')list=list.filter(q=>q.topic===bankArea);if(bankSearch.trim()){const k=bankSearch.trim().toLowerCase();list=list.filter(q=>(q.stem+' '+q.topic+' '+q.reason+' '+q.options.join(' ')).toLowerCase().includes(k));}return list;}
function bankView(){let list=bankQuestions();let topics=[...new Set(inStage().map(q=>q.topic))];return `${headline('QUESTION BANK',`전체 문제은행 · ${stage}차`,'시험 출제 범위에 맞춘 자체 제작 예상문제를 검색하고 한 문제씩 풀어보세요.')}<div class="list-controls"><input class="search-input" id="bank-search" type="search" placeholder="명령어, 개념, 문제 문장 검색..." value="${h(bankSearch)}" aria-label="문제 검색"><select id="bank-area" class="select-input" aria-label="단원 선택"><option value="all">전체 단원</option>${topics.map(t=>`<option value="${h(t)}" ${t===bankArea?'selected':''}>${h(t)}</option>`).join('')}</select></div><p class="note" id="bank-count" style="margin:-6px 0 15px">${list.length}문항 검색됨</p><div class="bank-list" id="bank-list">${list.map(q=>makeSmallCard(q)).join('')}</div>`;}
function bindSearch(){const input=document.getElementById('bank-search'),sel=document.getElementById('bank-area');if(input)input.addEventListener('input',e=>{bankSearch=e.target.value;updateBankList();});if(sel)sel.addEventListener('change',e=>{bankArea=e.target.value;updateBankList();});}
function updateBankList(){const list=bankQuestions(),el=document.getElementById('bank-list');if(el)el.innerHTML=list.length?list.map(q=>makeSmallCard(q)).join(''):'<div class="empty-state">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>';const count=document.getElementById('bank-count');if(count)count.textContent=`${list.length}문항 검색됨`;}
function wrongView(){let all=Object.entries(db.mistakes).filter(([id,x])=>BY_ID[id]&&BY_ID[id].stage===stage);let ids=all.filter(([id,x])=>notebookFilter==='all'?!x.cleared:!!x.cleared).map(([id])=>id);return `${headline('MY WEAK POINTS','오답노트','틀렸던 문항과 해설을 다시 공부해 보세요. 이해한 문제는 목록에서 정리할 수 있습니다.')}<div class="btn-row" style="margin-top:22px"><button class="${notebookFilter==='all'?'secondary-btn':'ghost-btn'}" data-action="notebookfilter" data-filter="all">복습 필요 (${all.filter(([id,x])=>!x.cleared).length})</button><button class="${notebookFilter==='cleared'?'secondary-btn':'ghost-btn'}" data-action="notebookfilter" data-filter="cleared">이해 완료 (${all.filter(([id,x])=>x.cleared).length})</button>${ids.length?`<button class="primary-btn" data-action="startwrong">${svg('refresh',16)} 선택 목록 다시 풀기</button>`:''}</div>${ids.length?`<div class="bank-list" style="margin-top:20px">${ids.map(id=>makeSmallCard(BY_ID[id],notebookFilter==='all'?'wrong':'bank')).join('')}</div>`:`<div class="empty-state" style="margin-top:20px"><div class="empty-icon">${svg('check',29)}</div><b>${notebookFilter==='all'?'복습할 오답이 아직 없어요.':'이해 완료한 문제가 없어요.'}</b><p>문제를 풀고 틀린 경우 오답노트에 자동으로 정리됩니다.</p><button class="secondary-btn" data-action="navigate" data-page="setup">문제 풀러 가기</button></div>`}`;}
function bookmarksView(){const ids=db.bookmarks.filter(id=>BY_ID[id]&&BY_ID[id].stage===stage);return `${headline('SAVED QUESTIONS','북마크','헷갈리거나 다시 보고 싶은 문제를 모아 복습할 수 있습니다.')}<div class="btn-row" style="margin:22px 0">${ids.length?`<button class="primary-btn" data-action="startbookmarks">${svg('play',16)} 저장한 문제 다시 풀기</button>`:''}<button class="ghost-btn" data-action="navigate" data-page="bank">문제은행 살펴보기</button></div>${ids.length?`<div class="bank-list">${ids.map(id=>makeSmallCard(BY_ID[id])).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">★</div><b>저장한 문제가 없습니다.</b><p>문제 오른쪽의 ☆을 눌러 북마크로 모아보세요.</p></div>`}`;}
function historyView(){const records=resultHistory();let latest=records.slice(0,8).reverse();return `${headline('MY PERFORMANCE','학습 기록','연습 성적의 흐름을 확인하고 취약 단원을 다시 정리해보세요.')}<div class="stat-grid" style="margin-top:24px"><div class="stat"><div><div class="stat-label">총 학습 횟수</div><div class="stat-value">${records.length}<small>회</small></div></div>${iconBlock('book')}</div><div class="stat"><div><div class="stat-label">최고 정답률</div><div class="stat-value">${records.length?Math.max(...records.map(r=>r.score)):0}<small>%</small></div></div>${iconBlock('target','green')}</div><div class="stat"><div><div class="stat-label">누적 풀이 문항</div><div class="stat-value">${records.reduce((a,r)=>a+r.total,0)}<small>문항</small></div></div>${iconBlock('exam','orange')}</div></div><div class="two-grid" style="margin-top:18px"><section class="panel"><b>최근 정답률 추이</b>${latest.length?`<div class="bar-chart">${latest.map((r,i)=>`<div class="bar-col" title="${r.score}점"><span>${r.score}%</span><i style="--barheight:${Math.max(5,r.score)}px"></i><span>${i+1}회</span></div>`).join('')}</div>`:`<div class="history-empty" style="margin-top:20px">아직 표시할 학습 기록이 없습니다.</div>`}</section><section class="panel"><b>학습 포인트</b><div style="margin-top:16px"><p class="subtitle">${records.length?'학습 데이터를 꾸준히 쌓아가고 있어요. 특히 낮은 점수가 나온 과목의 해설을 반복해서 확인해 보세요.':'모의고사 한 회를 먼저 풀어 현재 실력을 점검해 보세요.'}</p><button class="secondary-btn" style="margin-top:19px" data-action="navigate" data-page="setup">실전 연습 시작하기 →</button></div></section></div><div class="section-title">최근 학습 내역</div>${records.length?`<div class="panel" style="overflow-x:auto"><table class="history-table"><thead><tr><th>학습 날짜</th><th>학습 유형</th><th>정답</th><th>점수</th><th>결과</th></tr></thead><tbody>${records.map(r=>`<tr><td>${new Date(r.ts).toLocaleDateString('ko-KR')}</td><td><strong>${h(modeName(r.kind))}</strong></td><td>${r.correct}/${r.total}</td><td><strong>${r.score}점</strong></td><td>${r.passed===null?'학습 완료':`<span class="chip ${r.passed?'green':'red'}">${r.passed?'합격 기준 충족':'기준 미달'}</span>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="history-empty">아직 학습 기록이 없습니다.</div>`}<div class="btn-row" style="margin-top:19px"><button class="ghost-btn" data-action="export">${svg('book',16)} 학습 기록 JSON 저장</button><button class="danger-btn" data-action="reset">모든 학습 기록 초기화</button></div>`;}
function guideView(){return `${headline('EXAM GUIDE','리눅스마스터 2급 시험 안내','KAIT 공식 시험 기준을 반영해 준비에 필요한 핵심 정보를 정리했습니다.')}<div class="guide-grid"><article class="guide-card"><span class="chip">1차 · 온라인</span><h3 style="margin-top:15px">리눅스 일반</h3><p>객관식 4지선다 · <b>50문항 / 60분</b></p><p>합격 기준: <b>60점 이상</b></p><p>핵심 범위: 리눅스 개요와 역사, 설치 및 부팅, 기본 명령어, 사용자·파일 관리.</p></article><article class="guide-card"><span class="chip">2차 · 필기</span><h3 style="margin-top:15px">운영 및 관리 + 활용</h3><p>객관식 4지선다 · <b>80문항 / 100분</b></p><p>합격 기준: <b>60점 이상 + 과목별 40% 이상</b></p><p>운영 및 관리 48문항, 활용 32문항. 과목별로 한 문제당 1.25점으로 모의 채점합니다.</p></article><article class="guide-card"><h3>공식 시험 관련 링크</h3><p><a href="https://www.ihd.or.kr/introducesubject1.do" target="_blank" rel="noopener noreferrer">↗ KAIT 리눅스마스터 자격·출제기준</a></p><p><a href="https://www.ihd.or.kr/guidequestion.do" target="_blank" rel="noopener noreferrer">↗ KAIT 문제공개·모범답안 확인</a></p><p><a href="https://www.ihd.or.kr/noticelist.do" target="_blank" rel="noopener noreferrer">↗ KAIT 공식 공지사항</a></p><p class="note">공식 기출문제의 저작권은 KAIT에 있으며, 이용하려면 별도 허가가 필요합니다. 이 사이트는 원문을 복제하지 않습니다.</p></article><article class="guide-card"><h3>이 사이트를 효과적으로 쓰는 방법</h3><p><b>①</b> 빠른 연습으로 각 단원의 핵심 개념을 익힙니다.</p><p><b>②</b> 오답노트로 헷갈리는 명령어 옵션을 복습합니다.</p><p><b>③</b> 제한 시간 모의고사로 실전 감각을 키웁니다.</p><p><b>④</b> 2차는 총점과 과락 여부를 모두 확인합니다.</p><p class="note">점수는 연습용 예상 점수입니다. 문제은행은 자체 제작 문항이며 실제 회차의 문항·난도·합격을 보장하지 않습니다.</p></article><article class="guide-card"><h3>문제 및 데이터 관리</h3><p>수록된 자체 제작 문항: <b>${QUESTIONS.length}문항</b> (1차 ${QUESTIONS.filter(q=>q.stage===1).length}문항 · 2차 ${QUESTIONS.filter(q=>q.stage===2).length}문항)</p><p>로그인 없이 동작하고, 학습 내용은 <b>사용 중인 브라우저</b>에 저장됩니다. 다른 기기와 자동 동기화되지는 않습니다.</p><p>문제풀이 및 오답노트는 인터넷 없이도 사용할 수 있습니다. 다만 공식 자료 링크 열기는 인터넷 연결이 필요합니다.</p><button class="ghost-btn" data-action="export">학습 기록 JSON 저장</button></article><article class="guide-card"><h3>학습 시 주의할 점</h3><p>명령어 옵션과 소프트웨어 환경은 배포판·버전에 따라 달라질 수 있습니다. 이 문제은행은 개념 학습용이며 시험 시행 공지와 공식 출제기준을 우선 확인하세요.</p><p>2027년 출제문제 버전 변경 안내가 공지되어 있으므로 2027년 이후 응시자는 KAIT 공지사항을 확인해야 합니다.</p></article></div>`;}
let toastTimer;
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700);}
function navigate(p){page=p;mobileOpen=false;if(p!=='bank'){bankSearch='';bankArea='all';}render();window.scrollTo(0,0);}
function downloadData(){const content=JSON.stringify({exportedAt:new Date().toISOString(),history:db.history,mistakes:db.mistakes,bookmarks:db.bookmarks},null,2);const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='linuxmaster2-study-record.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록 파일을 저장했습니다.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;const s=db.session;switch(a){case'menu':mobileOpen=!mobileOpen;render();break;case'closemenu':mobileOpen=false;render();break;case'navigate':navigate(b.dataset.page);break;case'stage':stage=Number(b.dataset.stage);mobileOpen=false;render();break;case'setupkind':setupKind=b.dataset.kind;render();break;case'setupsize':setupSize=Number(b.dataset.size);render();break;case'startsetup':startSession({kind:setupKind,count:setupSize});break;case'startfull':startSession({kind:'full'});break;case'startquick':startSession({kind:'quick',count:20});break;case'starttopic':startSession({kind:'topic',topic:b.dataset.topic,count:10});break;case'startwrong':{const ids=Object.entries(db.mistakes).filter(([id,x])=>BY_ID[id]&&BY_ID[id].stage===stage&&(notebookFilter==='all'?!x.cleared:x.cleared)).map(([id])=>id);startSession({kind:'wrong',ids});break;}case'startbookmarks':startSession({kind:'bookmarks',ids:db.bookmarks.filter(id=>BY_ID[id].stage===stage)});break;case'single':startSession({kind:'single',ids:[b.dataset.id],s:BY_ID[b.dataset.id].stage});break;case'answer':if(s){const id=s.ids[s.index];if(s.mode==='study'&&s.graded[id]!==undefined)return;s.answers[id]=Number(b.dataset.ans);save();render();}break;case'grade':if(s)grade();break;case'next':if(s)next();break;case'prev':if(s&&s.index>0){s.index--;save();render();window.scrollTo(0,0);}break;case'goto':if(s){s.index=Number(b.dataset.index);save();render();window.scrollTo(0,0);}break;case'submit':if(s){if(s.mode==='exam')submitSession();else if(window.confirm('현재까지 학습한 내용으로 마칠까요?'))finishSession();}break;case'resume':if(s){page='quiz';stage=s.stage;render();window.scrollTo(0,0);}break;case'bookmark':{const id=b.dataset.id,idx=db.bookmarks.indexOf(id);if(idx<0)db.bookmarks.push(id);else db.bookmarks.splice(idx,1);save();if(page==='bank'){updateBankList();}else render();toast(idx<0?'북마크에 저장했습니다.':'북마크에서 해제했습니다.');break;}case'mastered':if(db.mistakes[b.dataset.id]){db.mistakes[b.dataset.id].cleared=true;save();render();toast('이해 완료 목록으로 옮겼습니다.');}break;case'notebookfilter':notebookFilter=b.dataset.filter;render();break;case'resultfilter':resultFilter=b.dataset.filter;render();break;case'retrywrong':{const r=db.lastResult;if(r?.wrongIds?.length)startSession({kind:'wrong',ids:r.wrongIds,s:r.stage});break;}case'export':downloadData();break;case'reset':if(window.confirm('모의고사, 오답, 북마크, 학습 기록을 모두 삭제하시겠습니까? 복구할 수 없습니다.')){db={history:[],mistakes:{},bookmarks:[],session:null,lastResult:null};save();navigate('home');toast('학습 기록을 초기화했습니다.');}break;}});
document.addEventListener('keydown',ev=>{if(page!=='quiz'||!db.session||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)||ev.altKey||ev.metaKey||ev.ctrlKey)return;const s=db.session;if(['1','2','3','4'].includes(ev.key)){const id=s.ids[s.index];if(s.mode==='study'&&s.graded[id]!==undefined)return;s.answers[id]=Number(ev.key)-1;save();render();}else if(ev.key==='ArrowRight'){ev.preventDefault();next();}else if(ev.key==='ArrowLeft'){ev.preventDefault();if(s.index>0){s.index--;save();render();}}else if(ev.key==='Enter'&&s.mode==='study'){ev.preventDefault();if(s.graded[s.ids[s.index]]!==undefined)next();else grade();}});
setInterval(()=>{if(page==='quiz'&&db.session?.mode==='exam')updateClock();},1000);
if(db.session&&db.session.deadline&&db.session.deadline<=Date.now()){finishSession(true);}else{render();}
</script>
