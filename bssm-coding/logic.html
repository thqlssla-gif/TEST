<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7467dd">
<meta name="description" content="부산소프트웨어마이스터고 입학 비공식 사고력 연습. 50분 3문항 훈련, 풀이과정과 경계값 설명, Python C언어 예시 해설. 공식 기출 아님.">
<title>논리적 사고력 50분 실전 연습 | BSSM CODING LAB</title>
<link rel="stylesheet" href="./style.css">
<style>
.logic-shell{min-height:100vh}.logic-head{min-height:69px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px max(20px,calc((100vw - 1160px)/2));gap:22px;justify-content:space-between}
.logic-head .back{font-size:12px;font-weight:800;text-decoration:none;color:#6c5abe;white-space:nowrap}.logic-brand{font-weight:900;letter-spacing:-.7px;color:#2b3352}.logic-brand span{font-size:11px;color:#96a0b2;font-weight:700}.logic-main{max-width:1160px;padding:34px 24px 55px;margin:0 auto}.logic-head .segment{flex-shrink:0}.logic-progress{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #e4dfff;border-radius:15px;background:#f8f6ff;padding:17px 21px;margin-bottom:18px}.logic-progress strong{font-size:15px}.logic-progress span{display:block;font-size:11px;color:#9285b2}.clock{font-size:24px;font-family:ui-monospace,monospace;font-weight:900;color:#6553c8;font-variant-numeric:tabular-nums}
.logic-q-switch{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 17px}.logic-q-switch button{padding:11px 16px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#8993a7;font-weight:800;font-size:12px}.logic-q-switch button.active{background:#7764de;border-color:#7764de;color:white}.logic-question h2{font-size:22px;margin:20px 0 10px}.logic-story{white-space:pre-wrap;font-size:14px;color:#43516b;line-height:1.9}.logic-io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.logic-io>div{border:1px solid #e7eaf2;background:#fafbfe;border-radius:12px;padding:14px}.logic-io b{font-size:12px;color:#6155b3}.logic-io p{font-size:12px;color:#63718a;white-space:pre-wrap;margin:5px 0 0}.logic-fields{display:grid;gap:9px}.logic-fields label{margin-top:13px;font-size:13px;font-weight:850;color:#46536e}.logic-fields textarea{width:100%;border:1px solid #e3e6ee;border-radius:12px;padding:15px;min-height:75px;background:#fff;color:#27354e;resize:vertical;font-size:13px;line-height:1.8}.logic-fields #steps{min-height:125px}.logic-fields textarea.logic-code{background:#252d42;color:#eaf0fb;min-height:160px;font-family:Consolas,"D2Coding",monospace;font-size:12px;white-space:pre;tab-size:4}
.logic-examples{border:1px solid #e5e8f0;border-radius:12px;margin-bottom:14px;padding:12px 16px;color:#6e7d94}.logic-examples summary{font-size:12px;font-weight:800;cursor:pointer;color:#6655c4}.logic-examples>div{margin-top:12px}.logic-examples>div>div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eff0f5;padding:8px 0;font-size:12px}.logic-examples code{white-space:pre-wrap}.logic-examples b{color:#6152b8}
.logic-review{margin-bottom:16px}.logic-review h2{font-size:19px;margin:15px 0}.logic-review-grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}.logic-review-grid h3{font-size:14px;margin:0 0 12px}.logic-answer{background:#f8f9fc;border-radius:11px;border:1px solid #e9ebf2;padding:13px;margin-bottom:9px;white-space:pre-wrap;overflow-wrap:anywhere}.logic-answer b{display:block;font-size:11px;color:#6b58bd;margin-bottom:5px}.logic-answer p{font-size:12px;color:#5e6b82;margin:0;white-space:pre-wrap}.logic-answer span{display:block;font-size:12px;margin:5px 0}.logic-review-grid ol{font-size:12px;color:#5f6f87;line-height:1.9;padding-left:21px}.logic-review-grid li{margin:4px 0}.logic-review details{margin:12px 0}.logic-review summary{color:#6251c0;font-size:12px;font-weight:800;cursor:pointer}.logic-rubric{border-top:1px solid #e8ebf3;padding-top:16px;margin-top:17px}.logic-rubric h3{font-size:14px}.logic-check{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid #e6e8f0;border-radius:10px;margin:8px 0;font-size:12px;color:#61718b;cursor:pointer}.logic-check input{accent-color:#7865d8;width:17px;height:17px}.logic-history-line{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #edf0f5}.logic-history-line strong{font-size:12px;display:block}.logic-history-line small{color:#96a0b1}.question-actions>div{display:flex;gap:8px}
@media(max-width:730px){.logic-head{padding:10px 12px;gap:8px}.logic-brand{font-size:12px}.logic-brand span{display:none}.logic-head .segment button{padding:7px 9px}.logic-head .back{font-size:11px}.logic-main{padding:22px 14px}.logic-review-grid,.logic-io{grid-template-columns:1fr}.logic-q-switch button{flex:1;padding:9px 8px}.logic-progress{padding:13px}.logic-progress strong{font-size:12px}.clock{font-size:19px}.logic-question{padding:17px}.logic-question h2{font-size:19px}}
@media print{.logic-head,.question-actions,.logic-rubric .btn,.footer{display:none}.logic-main{max-width:none;padding:0}.logic-review{break-inside:avoid}.panel{box-shadow:none}}
</style>
</head>
<body>
<div id="logic-root"></div>
<script src="./logic-questions.js"></script>
<script src="./logic.js"></script>
</body>
</html>
